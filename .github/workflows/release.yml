name: Build desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: "--target x86_64-pc-windows-msvc --bundles nsis,msi"
            artifact_name: windows-x64
            artifact_paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - name: macOS Apple Silicon
            platform: macos-15
            rust_targets: aarch64-apple-darwin
            tauri_args: "--target aarch64-apple-darwin --bundles dmg"
            artifact_name: macos-apple-silicon
            artifact_paths: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            platform: macos-15-intel
            rust_targets: x86_64-apple-darwin
            tauri_args: "--target x86_64-apple-darwin --bundles dmg"
            artifact_name: macos-intel
            artifact_paths: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux x64
            platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: "--target x86_64-unknown-linux-gnu --bundles appimage,deb"
            artifact_name: linux-x64
            artifact_paths: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux native dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxdo-dev \
            build-essential \
            pkg-config \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.tauri_args }}

      - name: Stage installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Cross-platform Kotoba Float desktop release.

          Download the installer for your operating system below. These initial builds are unsigned unless repository signing secrets have been configured; see the README for platform security prompts and current capability status.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Kotoba Float $RELEASE_TAG" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Kotoba Float $RELEASE_TAG" --notes-file release-notes.md --prerelease
          fi
          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
